services:
  - type: web
    name: e-cart-api-cvb9
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/products?page=0&size=1
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: DB_HOST
        fromDatabase:
          name: e-cart-db-cvb9
          property: host
      - key: DB_PORT
        fromDatabase:
          name: e-cart-db-cvb9
          property: port
      - key: DB_NAME
        value: ecart
      - key: DB_USERNAME
        fromDatabase:
          name: e-cart-db-cvb9
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: e-cart-db-cvb9
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGIN
        value: https://e-cart-storefront-cvb9.onrender.com

  - type: web
    name: e-cart-storefront-cvb9
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://e-cart-api-cvb9.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: e-cart-db-cvb9
    databaseName: ecart
    user: ecart
    region: oregon
    plan: free
